[package]
name = "briq_protocol"
version = "2.1.0"
cairo-version = "2.9.2"
edition = "2023_01"

[[target.starknet-contract]]
sierra = true
build-external-contracts = ["dojo::world::world_contract::world"]

[cairo]
sierra-replace-ids = true

[dependencies]
dojo = { git = "https://github.com/dojoengine/dojo", tag = "v1.2.1" }
origami = { git = "https://github.com/dojoengine/origami", tag = "v1.0.0", features = ["tokens"] }

[tool.dojo.world]
name = "briq"
description = "Collect, build and play with briqs, the building blocks of the metaverse."
icon_uri = "file://docs/squarebriq.jpg"
cover_uri = "/Volumes/Samsung_T5/Programming/briq-protocol/docs/banner.png"
website = "https://briq.construction/"
socials.x = "https://twitter.com/briqNFT"

[[target.dojo]]
build-external-contracts = [
    'origami::tokens::erc1155::m_Balance',
    'origami::tokens::erc1155::m_OperatorApproval',
    'origami::tokens::erc721::m_Balance',
    'origami::tokens::erc721::m_Owner',
    'origami::tokens::erc721::m_TokenApproval'
]

#[tool.dojo.env]
rpc_url = "http://localhost:5050/"
# Default account for katana with seed = 0
account_address = "0x03ee9e18edc71a6df30ac3aca2e0b02a198fbce19b7480a63a0d71cbd76652e0"
private_key = "0x0300001800000000300000180000000000030000000000003006001800006600"

